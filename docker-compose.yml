services:
  app:
    build:
      context: .
      target: dev
    ports:
      - "8080:80"
    environment:
      # FrankenPHP's HTTP SAPI does not populate $_SERVER from .env.local at boot
      # (see public/index.php) — set explicitly so the web entrypoint runs in dev.
      APP_ENV: dev
      APP_DEBUG: "1"
    volumes:
      - .:/var/www/html
      - ./docker/Caddyfile:/etc/frankenphp/Caddyfile
      - ./docker/php/conf.d/app.ini:/usr/local/etc/php/conf.d/app.ini
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0.36
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: kdos_graphie
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  mysql_data:
